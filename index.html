    gl.forEach(function(p){var o=p.goalie,gaa=p.gp?(o.ga/p.gp).toFixed(2):"–";h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(short(p.team))+'</td><td class="'+p.div[0]+'">'+p.div+'</td><td class="n">'+p.gp+'</td><td class="n">'+o.w+'</td><td class="n">'+o.l+'</td><td class="n">'+o.t+'</td><td class="n">'+o.so+'</td><td class="n">'+o.ga+'</td><td class="n">'+gaa+'</td></tr>'});h+='</table></div>'}
  return h;
}
function teamsView(){
  var rec={};Object.keys(DB.teams).forEach(function(id){rec[DB.teams[id].name]={w:0,l:0,t:0,gf:0,ga:0}});
  allGames().forEach(function(g){if(g.hs==null)return;[[g.home,g.hs,g.as],[g.away,g.as,g.hs]].forEach(function(x){var r=rec[x[0]];if(!r)return;r.gf+=x[1];r.ga+=x[2];x[1]>x[2]?r.w++:x[1]<x[2]?r.l++:r.t++})});
  var h="";
  ["South","North","Unassigned"].forEach(function(d){
    var rows=teamList().filter(function(t){return t.division===d});if(!rows.length)return;
    var pts=function(r){return r.w*2+r.t},sc=function(t){return rec[t.name]};
    rows.sort(function(a,b){var x=sc(a),y=sc(b);return pts(y)-pts(x)||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||a.name.localeCompare(b.name)});
    h+='<h3 class="'+d[0]+'">'+d+(d==="Unassigned"?'':' Division')+'</h3><div class="card w"><table><tr><th class="n">#</th><th>Team</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n">T</th><th class="n">PTS</th><th class="n">GF</th><th class="n">GA</th><th class="n">DIFF</th></tr>';
    rows.forEach(function(t,i){var r=sc(t),df=r.gf-r.ga;h+='<tr><td class="n">'+(i+1)+'</td><td>'+esc(short(t.name))+'</td><td class="n">'+(r.w+r.l+r.t)+'</td><td class="n">'+r.w+'</td><td class="n">'+r.l+'</td><td class="n">'+r.t+'</td><td class="n"><b>'+pts(r)+'</b></td><td class="n">'+r.gf+'</td><td class="n">'+r.ga+'</td><td class="n">'+(df>0?"+":"")+df+'</td></tr>'});
    h+='</table></div>';
  });
  return h+'<div class="muted">Records use games with known scores (2 points for a win, 1 for a tie). The league page only exposes each team\u2019s most recent result, so records fill in as games are played and you refresh.</div>';
}
function tmin(t){var m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||"");if(!m)return 0;return(+m[1]%12+(/PM/i.test(m[3])?12:0))*60+ +m[2]}
function scheduleView(){
  var gs=allGames(),names={};gs.forEach(function(g){names[g.home]=1;names[g.away]=1});
  var tl=Object.keys(names).sort(),td=new Date(),today=td.getFullYear()+"-"+("0"+(td.getMonth()+1)).slice(-2)+"-"+("0"+td.getDate()).slice(-2);
  var h='<div class="pills"><select onchange="sch.div=this.value;render()">'+["All","South","North"].map(function(d){return'<option'+(sch.div===d?" selected":"")+'>'+d+'</option>'}).join("")+'</select><select onchange="sch.team=this.value;render()"><option>All</option>'+tl.map(function(t){return'<option value="'+esc(t)+'"'+(sch.team===t?" selected":"")+'>'+esc(short(t))+'</option>'}).join("")+'</select><button class="'+(sch.past?"on":"")+'" onclick="setPast('+(sch.past?"false":"true")+')">'+(sch.past?"Show Upcoming Games":"Show Past Games & Scores")+'</button></div>';
  gs=gs.filter(function(g){return(sch.team==="All"||g.home===sch.team||g.away===sch.team)&&(sch.div==="All"||divOf(g.home)===sch.div||divOf(g.away)===sch.div)});
  var isPast=function(g){return g.date<today||g.hs!=null},key=function(g){return g.date+("0000"+tmin(g.time)).slice(-4)};
  var up=gs.filter(function(g){return!isPast(g)}).sort(function(a,b){return key(a).localeCompare(key(b))}),pa=gs.filter(isPast).sort(function(a,b){return key(b).localeCompare(key(a))});
  var day=function(d){return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})};
  var tbl=function(rows,past){var t='<div class="card w"><table><tr><th>Date</th><th>Time</th><th>Home</th><th>Away</th>'+(past?'<th>Score</th>':'')+'<th>Rink</th></tr>';rows.forEach(function(g){t+='<tr><td>'+day(g.date)+'</td><td>'+esc(g.time)+'</td><td>'+esc(short(g.home))+'</td><td>'+esc(short(g.away))+'</td>'+(past?'<td>'+(g.hs!=null?g.hs+' – '+g.as:'—')+'</td>':'')+'<td>'+esc(g.loc)+'</td></tr>'});if(!rows.length)t+='<tr><td colspan="6" class="U">No games.</td></tr>';return t+'</table></div>'};
  if(!sch.past)h+='<h3>Upcoming ('+up.length+')</h3>'+tbl(up,false);
  if(sch.past)h+='<h3>Past games &amp; scores ('+pa.length+')</h3>'+tbl(pa,true)+'<div class="muted">Scores show only where the league page exposes them (each team\u2019s latest result).</div>';
  return h;
}
function hl(){
  var v=document.getElementById("view"),US="Knights 1 White";
  v.querySelectorAll("td").forEach(function(td){if(td.textContent.trim()!==US)return;td.classList.add("us");var tr=td.parentNode;tr.classList.add("usrow");var t=tr.closest("table");if(!t||!t.rows[0])return;var hc=Array.prototype.map.call(t.rows[0].cells,function(c){return c.textContent.trim()}),i=hc.findIndex(function(x){return x==="Player"||x==="Goalie"});if(i>=0&&tr.cells[i])tr.cells[i].classList.add("us")});
  v.querySelectorAll("button").forEach(function(b){if(b.textContent.trim().indexOf(US)===0)b.classList.add("us")});
  v.querySelectorAll("option").forEach(function(o){if(o.textContent.trim()===US)o.classList.add("us")});
}
// ---- shell ----
function render(){
  var T=Object.keys(DB.teams).map(function(i){return DB.teams[i]}),sk=allSkaters(),G=allGames();
  var c=function(d){return T.filter(function(t){return t.division===d}).length};
  document.getElementById("kpi").innerHTML=[["Teams",T.length],["South",c("South")],["North",c("North")],["Skaters",sk.length],["Games",G.length]].map(function(k){return"<div><b>"+k[1]+"</b>"+k[0]+"</div>"}).join("");
  var tabs=[["stats","Player Stats"],["sched","Schedule & Scores"],["teams","Standings"],["imp","Import"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return'<button class="'+(t[0]===tab?"on":"")+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join("");
  document.getElementById("view").innerHTML={stats:statsView,sched:scheduleView,teams:teamsView,imp:importView}[tab]();hl();
}

function loadLive(){
  fetch("data.json?"+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    (d.teams||[]).forEach(function(e){try{
      var t=normalize(e.site),old=DB.teams[t.id];t.division=e.div;
      t.stats=Object.assign({},old&&old.stats);t.stats.Seeding=t.players;DB.teams[t.id]=t}catch(x){}});
    var hist=d.history||{};
    Object.keys(DB.teams).forEach(function(id){var t=DB.teams[id],m={};t.games.forEach(function(g){m[g.id]=g});
      Object.keys(hist).forEach(function(k){var g=hist[k];if(g.home===t.name||g.away===t.name)m[g.id]=Object.assign(m[g.id]||{},g)});
      t.games=Object.keys(m).map(function(k){return m[k]})});
    save();
    var u=document.querySelector("header .sub");
    if(u&&d.updated)u.innerHTML+=" · <b>Updated "+new Date(d.updated).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})+"</b>";
    render();
  }).catch(function(){});
}
render();loadLive();

</script></body></html>
